<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Git Package Manager for Unity</title>
  <desc id="description">A safe, explicit, cross-platform Git submodule workflow for UPM packages.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#111B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1160 80) rotate(140) scale(600)">
      <stop offset="0" stop-color="#F05A3C" stop-opacity=".3"/>
      <stop offset="1" stop-color="#F05A3C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g transform="translate(72 86) scale(.86)">
    <rect width="512" height="512" rx="112" fill="#111827" stroke="#334155" stroke-width="3"/>
    <path d="M92 154 256 68l164 86v204l-164 86-164-86Z" fill="none" stroke="#E5E7EB" stroke-width="30" stroke-linejoin="round"/>
    <path d="m92 154 164 90 164-90M256 244v200" fill="none" stroke="#E5E7EB" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 112v176m0 0 98 72" fill="none" stroke="#F05A3C" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="112" r="31" fill="#F05A3C"/>
    <circle cx="256" cy="288" r="31" fill="#F05A3C"/>
    <circle cx="354" cy="360" r="31" fill="#F05A3C"/>
  </g>
  <text x="588" y="220" fill="#F8FAFC" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="780" letter-spacing="-2">Git Package</text>
  <text x="588" y="286" fill="#F8FAFC" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="780" letter-spacing="-2">Manager</text>
  <text x="592" y="348" fill="#CBD5E1" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="27">Git submodules, made native to Unity.</text>
  <text x="592" y="416" fill="#94A3B8" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20">Explicit operations · Cross-platform · Editor-only · MIT</text>
  <rect x="592" y="468" width="432" height="52" rx="26" fill="#F05A3C"/>
  <text x="624" y="501" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing=".2">com.essentials.gitpackagemanager</text>
</svg>
