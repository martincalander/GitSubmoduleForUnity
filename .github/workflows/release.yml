name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      tag_object: ${{ steps.commit.outputs.tag_object }}

    steps:
      - name: Check out release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          prerelease="$(python3 .github/scripts/validate_repository.py --check-release-tag "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact release tag
        id: commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "Exact release tag $tag_ref does not exist." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag $tag_ref must be an annotated tag." >&2
            exit 1
          fi

          tag_object="$(git rev-parse --verify "$tag_ref")"
          if ! release_commit="$(git rev-parse --verify "${tag_ref}^{commit}")"; then
            echo "Release tag $tag_ref does not peel to a commit." >&2
            exit 1
          fi
          if [[ "$(git rev-parse --verify HEAD)" != "$release_commit" ]]; then
            echo "Checkout does not match exact release tag $tag_ref." >&2
            exit 1
          fi
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "sha=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Validate repository
        run: python3 .github/scripts/validate_repository.py

      - name: Verify release commit belongs to main
        env:
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "The full checkout did not provide origin/main." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo "Release commit is not reachable from origin/main; refusing release." >&2
            exit 1
          fi

      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Build immutable release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          mapfile -t archives < <(
            find dist -maxdepth 1 -type f -name '*.tgz' -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one release archive." >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          (cd dist && sha256sum -- "./$archive_name" > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload immutable release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ steps.commit.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  unity:
    name: Unity ${{ matrix.unity-version }} compile and EditMode tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: unity-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - unity-version: 6000.3.22f1
            unity-revision: 1c726e1fb402
            test-framework-version: 1.6.0
            custom-image: >-
              unityci/editor:ubuntu-6000.3.22f1-linux-il2cpp-3@sha256:bd9f0c77473bc842423236ec1498f180380f734dde521397e0fac2319865e87a
          - unity-version: 6000.5.0f1
            unity-revision: 88b47c5e7076
            test-framework-version: 1.7.0
            custom-image: >-
              unityci/editor:ubuntu-6000.5.0f1-linux-il2cpp-3@sha256:318fd4f7081fd1fed6f3a850aa22fb39fc185d6d798915ccc803a37a5596ef82

    steps:
      - name: Download validated release archive
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-package-${{ needs.validate.outputs.commit }}
          path: dist

      - name: Extract the exact archive that will be published
        run: |
          set -euo pipefail
          mapfile -t archives < <(
            find dist -maxdepth 1 -type f -name '*.tgz' -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one release archive." >&2
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir -p .ci
          tar -xzf "${archives[0]}" -C .ci
          test -f .ci/package/package.json

      - name: Create deterministic Unity archive test project
        id: test-project
        env:
          PACKAGE_NAME: com.martincalander.gitsubmodulemanager
          TEST_FRAMEWORK_VERSION: ${{ matrix.test-framework-version }}
          UNITY_REVISION: ${{ matrix.unity-revision }}
          UNITY_VERSION: ${{ matrix.unity-version }}
        run: |
          set -euo pipefail

          mapfile -t archives < <(
            find dist -maxdepth 1 -type f -name '*.tgz' -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one release archive." >&2
            exit 1
          fi

          archive="${archives[0]}"
          archive_name="$(basename "$archive")"
          package_version="$(jq -er '.version' .ci/package/package.json)"
          expected_archive="$PACKAGE_NAME-$package_version.tgz"
          if [[ "$archive_name" != "$expected_archive" ]]; then
            echo "Unexpected archive name: $archive_name" >&2
            exit 1
          fi

          project=.ci/release-test-project
          package_reference="file:../../../dist/$archive_name"
          mkdir -p \
            "$project/Assets" \
            "$project/Packages" \
            "$project/ProjectSettings"

          jq -n \
            --arg package_name "$PACKAGE_NAME" \
            --arg package_reference "$package_reference" \
            --arg test_framework "$TEST_FRAMEWORK_VERSION" '
            {
              dependencies: {
                "com.unity.test-framework": $test_framework
              },
              testables: [$package_name],
              enableLockFile: true
            }
            | .dependencies[$package_name] = $package_reference
          ' > "$project/Packages/manifest.json"

          printf \
            'm_EditorVersion: %s\nm_EditorVersionWithRevision: %s (%s)\n' \
            "$UNITY_VERSION" \
            "$UNITY_VERSION" \
            "$UNITY_REVISION" \
            > "$project/ProjectSettings/ProjectVersion.txt"

          resolved_archive="$(
            realpath "$project/Packages/${package_reference#file:}"
          )"
          test "$resolved_archive" = "$(realpath "$archive")"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "package_reference=$package_reference" >> "$GITHUB_OUTPUT"

      - name: Validate Unity license configuration
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "UNITY_EMAIL and UNITY_PASSWORD environment secrets are required." >&2
            exit 1
          fi
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) as an environment secret." >&2
            exit 1
          fi

      - name: Compile exact archive and run EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          packageMode: false
          projectPath: .ci/release-test-project
          unityVersion: ${{ matrix.unity-version }}
          customImage: ${{ matrix.custom-image }}
          testMode: EditMode
          artifactsPath: unity-release-test-results-${{ matrix.unity-version }}

      - name: Verify exact archive test evidence
        env:
          PACKAGE_NAME: com.martincalander.gitsubmodulemanager
          PACKAGE_REFERENCE: ${{ steps.test-project.outputs.package_reference }}
          RESULT_PATH: unity-release-test-results-${{ matrix.unity-version }}/editmode-results.xml
        run: |
          set -euo pipefail

          manifest=.ci/release-test-project/Packages/manifest.json
          lockfile=.ci/release-test-project/Packages/packages-lock.json
          test -f "$lockfile"
          jq -e \
            --arg package_name "$PACKAGE_NAME" \
            --arg package_reference "$PACKAGE_REFERENCE" '
            .dependencies[$package_name] as $package
            | $package.depth == 0
              and $package.source == "local-tarball"
              and $package.version == $package_reference
              and (.dependencies | has("com.unity.testtools.codecoverage") | not)
          ' "$lockfile" > /dev/null
          jq -e '
            .dependencies | has("com.unity.testtools.codecoverage") | not
          ' "$manifest" > /dev/null

          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          result_path = os.environ["RESULT_PATH"]
          root = ET.parse(result_path).getroot()
          if root.tag != "test-run":
              raise SystemExit(f"Unexpected NUnit root: {root.tag}")

          total = int(root.attrib.get("total", "0"))
          passed = int(root.attrib.get("passed", "0"))
          failed = int(root.attrib.get("failed", "0"))
          inconclusive = int(root.attrib.get("inconclusive", "0"))
          skipped_count = int(root.attrib.get("skipped", "0"))
          if (
              total <= 0
              or failed != 0
              or inconclusive != 0
              or passed + skipped_count != total
          ):
              raise SystemExit(
                  "Invalid NUnit totals: "
                  f"total={total} passed={passed} failed={failed} "
                  f"inconclusive={inconclusive} skipped={skipped_count}"
              )
          if root.attrib.get("result") not in {
              "Passed",
              "Skipped",
              "Skipped:Ignored",
          }:
              raise SystemExit(
                  f"NUnit run did not pass: {root.attrib.get('result')}"
              )

          allowed_skips = {
              (
                  "MartinCalander.GitSubmoduleManager.Editor.Tests."
                  "PackageManagerGitHubPackageProjectionTests."
                  "Reconcile_ExcludesAnAlreadyInstalledPackageName"
              ),
              (
                  "MartinCalander.GitSubmoduleManager.Editor.Tests."
                  "PackageManagerGitSubmoduleInstallMenuTests."
                  "InstallForRoot_RepeatedTrackedRootDoesNotDuplicateNativeItem"
              ),
              (
                  "MartinCalander.GitSubmoduleManager.Editor.Tests."
                  "PackageManagerSubmodulePresentationTests."
                  "ActivePageReflectionContract_OpenWindowProvidesDiagnostic"
              ),
          }
          all_cases = list(root.iter("test-case"))
          skipped = {
              case.attrib.get("fullname", case.attrib.get("name", "<unknown>"))
              for case in all_cases
              if case.attrib.get("result") == "Skipped"
          }
          unexpected_results = [
              case.attrib
              for case in all_cases
              if case.attrib.get("result") not in {"Passed", "Skipped"}
          ]
          if (
              len(all_cases) != total
              or len(skipped) != skipped_count
              or not skipped.issubset(allowed_skips)
              or unexpected_results
          ):
              raise SystemExit(
                  "Unexpected NUnit case results or skips: "
                  f"skipped={sorted(skipped)} results={unexpected_results}"
              )

          assembly_name = (
              "MartinCalander.GitSubmoduleManager.Editor.Tests.dll"
          )
          assemblies = [
              suite for suite in root.iter("test-suite")
              if suite.attrib.get("type") == "Assembly"
              and suite.attrib.get("name") == assembly_name
          ]
          if len(assemblies) != 1:
              raise SystemExit(
                  f"Expected one {assembly_name} suite, found {len(assemblies)}"
              )
          if int(assemblies[0].attrib.get("total", "0")) <= 0:
              raise SystemExit(f"{assembly_name} did not run any tests")

          compatibility_fixtures = (
              "PackageManagerCompatibilityContractTests",
              "PackageManagerUnityVersionCollectionContractTests",
          )
          for fixture_name in compatibility_fixtures:
              fixtures = [
                  suite for suite in root.iter("test-suite")
                  if suite.attrib.get("type") == "TestFixture"
                  and suite.attrib.get("name") == fixture_name
              ]
              if len(fixtures) != 1:
                  raise SystemExit(
                      f"Expected one {fixture_name} fixture, found {len(fixtures)}"
                  )
              cases = list(fixtures[0].iter("test-case"))
              if not cases or any(
                  case.attrib.get("result") != "Passed" for case in cases
              ):
                  raise SystemExit(
                      f"Every {fixture_name} case must run and pass"
                  )

          if skipped:
              print("Allowed environment-dependent skips:", file=sys.stderr)
              for test_name in sorted(skipped):
                  print(f"- {test_name}", file=sys.stderr)

          print(
              "Verified exact archive test evidence: "
              f"total={total}, passed={passed}, skipped={skipped_count}"
          )
          PY

          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-editmode-${{ matrix.unity-version }}-${{ needs.validate.outputs.tag }}
          path: unity-release-test-results-${{ matrix.unity-version }}/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish tested UPM archive
    needs:
      - validate
      - unity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh creates the release and uploads its assets.
    environment: release

    steps:
      - name: Check out validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag still targets the tested commit
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "Exact release tag $tag_ref no longer exists." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag $tag_ref is no longer an annotated tag." >&2
            exit 1
          fi

          tag_object="$(git rev-parse --verify "$tag_ref")"
          if ! tag_commit="$(git rev-parse --verify "${tag_ref}^{commit}")"; then
            echo "Release tag $tag_ref no longer peels to a commit." >&2
            exit 1
          fi
          if [[ "$tag_object" != "$EXPECTED_TAG_OBJECT" || "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG moved after validation; refusing to publish." >&2
            exit 1
          fi

          if [[ "$(git rev-parse --verify HEAD)" != "$tag_commit" ]]; then
            echo "Checkout no longer matches release tag $RELEASE_TAG." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "The full checkout did not provide origin/main." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Tag $RELEASE_TAG is no longer reachable from origin/main." >&2
            exit 1
          fi

      - name: Download the tested release archive
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-package-${{ needs.validate.outputs.commit }}
          path: dist

      - name: Verify the tested archive checksum
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            dist/*.tgz
            dist/SHA256SUMS
            --verify-tag
            --generate-notes
            --title "Git Submodule Manager $RELEASE_TAG"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
