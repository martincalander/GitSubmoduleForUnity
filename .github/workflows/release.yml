name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      tag_object: ${{ steps.commit.outputs.tag_object }}

    steps:
      - name: Check out release validation tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          prerelease="$(python3 .github/scripts/validate_repository.py --check-release-tag "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Resolve exact release tag
        id: commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          git update-ref -d "$tag_ref"
          if ! git fetch --no-tags origin "$tag_ref:$tag_ref"; then
            echo "Exact release tag $tag_ref could not be fetched." >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "Exact release tag $tag_ref does not exist." >&2
            exit 1
          fi

          tag_object="$(git rev-parse --verify "$tag_ref")"
          if ! release_commit="$(git rev-parse --verify "${tag_ref}^{commit}")"; then
            echo "Release tag $tag_ref does not peel to a commit." >&2
            exit 1
          fi
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "sha=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Check out resolved release commit
        env:
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: git checkout --detach "$RELEASE_COMMIT"

      - name: Validate repository
        run: python3 .github/scripts/validate_repository.py

      - name: Verify release commit belongs to main
        env:
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo "Release commit is not reachable from origin/main; refusing release." >&2
            exit 1
          fi

      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Build immutable release archive
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          (cd dist && sha256sum -- ./*.tgz > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload immutable release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ steps.commit.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  unity:
    name: Unity 2021.3 compile and EditMode tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: unity-ci

    steps:
      - name: Download validated release archive
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-package-${{ needs.validate.outputs.commit }}
          path: dist

      - name: Extract the exact archive that will be published
        run: |
          mkdir -p .ci
          tar -xzf dist/*.tgz -C .ci
          test -f .ci/package/package.json
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Validate Unity license configuration
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "UNITY_EMAIL and UNITY_PASSWORD repository secrets are required." >&2
            exit 1
          fi
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) as a repository secret." >&2
            exit 1
          fi

      - name: Compile package and run EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          packageMode: true
          projectPath: .ci/package
          unityVersion: 2021.3.0f1
          testMode: EditMode
          artifactsPath: unity-release-test-results

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-editmode-${{ needs.validate.outputs.tag }}
          path: unity-release-test-results/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish tested UPM archive
    needs:
      - validate
      - unity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh creates the release and uploads its assets.
    environment: release

    steps:
      - name: Check out validated release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag still targets the tested commit
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          git update-ref -d "$tag_ref"
          if ! git fetch --no-tags origin "$tag_ref:$tag_ref"; then
            echo "Exact release tag $tag_ref could not be fetched again." >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "Exact release tag $tag_ref no longer exists." >&2
            exit 1
          fi

          tag_object="$(git rev-parse --verify "$tag_ref")"
          if ! tag_commit="$(git rev-parse --verify "${tag_ref}^{commit}")"; then
            echo "Release tag $tag_ref no longer peels to a commit." >&2
            exit 1
          fi
          if [[ "$tag_object" != "$EXPECTED_TAG_OBJECT" || "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG moved after validation; refusing to publish." >&2
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Tag $RELEASE_TAG is no longer reachable from origin/main." >&2
            exit 1
          fi

      - name: Download the tested release archive
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-package-${{ needs.validate.outputs.commit }}
          path: dist

      - name: Verify the tested archive checksum
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            dist/*.tgz
            dist/SHA256SUMS
            --verify-tag
            --generate-notes
            --title "Git Submodule Manager $RELEASE_TAG"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
