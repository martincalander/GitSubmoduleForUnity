name: Sanity Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate UPM package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository structure and links
        run: python3 .github/scripts/validate_repository.py

      - name: Lint Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.0
          "**/*.md"
          "#Library"
          "#Temp"

      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Inspect package archive
        run: npm pack --ignore-scripts --dry-run

      - name: Build package archive
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          mapfile -t archives < <(
            find artifacts -maxdepth 1 -type f -name '*.tgz' -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one UPM package archive." >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          (cd artifacts && sha256sum -- "./$archive_name" > SHA256SUMS)
          (cd artifacts && sha256sum --check SHA256SUMS)

      - name: Upload package preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upm-package-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  portability:
    name: Validate portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate repository structure and links
        run: python .github/scripts/validate_repository.py

      - name: Verify package contents on this platform
        run: npm pack --ignore-scripts --dry-run

  required:
    name: Required sanity gate
    if: ${{ always() }}
    needs:
      - package
      - portability
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Require all non-secret checks
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
        run: |
          if [[ "$PACKAGE_RESULT" != "success" || "$PORTABILITY_RESULT" != "success" ]]; then
            printf 'Required checks failed: package=%s portability=%s\n' \
              "$PACKAGE_RESULT" "$PORTABILITY_RESULT" >&2
            exit 1
          fi
