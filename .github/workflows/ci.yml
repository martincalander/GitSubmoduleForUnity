name: Sanity Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional trusted full commit SHA to test
        required: false
        type: string
      unity_version:
        description: Pinned Unity Editor image for the manual compatibility run
        required: false
        default: 6000.3.22f1
        type: choice
        options:
          - 6000.3.22f1
          - 6000.5.0f1

permissions:
  contents: read

concurrency:
  group: sanity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate UPM package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate repository structure and links
        run: python3 .github/scripts/validate_repository.py

      - name: Lint Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.0
          "**/*.md"
          "#Library"
          "#Temp"

      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Inspect package archive
        run: npm pack --ignore-scripts --dry-run

      - name: Build package archive
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          mapfile -t archives < <(
            find artifacts -maxdepth 1 -type f -name '*.tgz' -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one UPM package archive." >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          (cd artifacts && sha256sum -- "./$archive_name" > SHA256SUMS)
          (cd artifacts && sha256sum --check SHA256SUMS)

      - name: Upload package preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upm-package-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  portability:
    name: Validate portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Validate repository structure and links
        run: python .github/scripts/validate_repository.py

      - name: Verify package contents on this platform
        run: npm pack --ignore-scripts --dry-run

  required:
    name: Required sanity gate
    if: ${{ always() }}
    needs:
      - package
      - portability
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Require all non-secret checks
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
        run: |
          if [[ "$PACKAGE_RESULT" != "success" || "$PORTABILITY_RESULT" != "success" ]]; then
            printf 'Required checks failed: package=%s portability=%s\n' \
              "$PACKAGE_RESULT" "$PORTABILITY_RESULT" >&2
            exit 1
          fi

  unity:
    name: Unity ${{ inputs.unity_version || '6000.3.22f1' }} compile and EditMode tests
    # Never expose Unity credentials to pull-request-controlled C#. Enable the
    # push gate with the UNITY_CI_ENABLED repository variable after configuring
    # the protected unity-ci environment, or run it manually for a reviewed ref.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.UNITY_CI_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: unity-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Verify exact Unity test revision
        env:
          REQUESTED_SHA: ${{ inputs.ref || github.sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Unity tests accept only a full 40-character commit SHA." >&2
            exit 1
          fi
          actual_sha="$(git rev-parse --verify HEAD)"
          if [[ "${actual_sha,,}" != "${REQUESTED_SHA,,}" ]]; then
            echo "Checked-out revision does not match the reviewed commit SHA." >&2
            exit 1
          fi

      - name: Resolve pinned Unity image
        id: unity-image
        env:
          REQUESTED_UNITY_VERSION: ${{ inputs.unity_version || '6000.3.22f1' }}
        run: |
          case "$REQUESTED_UNITY_VERSION" in
            6000.3.22f1)
              image="unityci/editor:ubuntu-6000.3.22f1-linux-il2cpp-3@sha256:bd9f0c77473bc842423236ec1498f180380f734dde521397e0fac2319865e87a"
              ;;
            6000.5.0f1)
              image="unityci/editor:ubuntu-6000.5.0f1-linux-il2cpp-3@sha256:318fd4f7081fd1fed6f3a850aa22fb39fc185d6d798915ccc803a37a5596ef82"
              ;;
            *)
              echo "Unity CI has no reviewed image for $REQUESTED_UNITY_VERSION." >&2
              exit 1
              ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build exact UPM test archive
        run: |
          set -euo pipefail
          mkdir -p .ci/dist .ci/extracted
          npm pack --ignore-scripts --pack-destination .ci/dist
          mapfile -t archives < <(
            find .ci/dist -maxdepth 1 -type f -name '*.tgz' -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one UPM test archive." >&2
            exit 1
          fi
          tar -xzf "${archives[0]}" -C .ci/extracted
          test -f .ci/extracted/package/package.json

      - name: Create deterministic Unity archive test project
        id: test-project
        env:
          PACKAGE_NAME: com.martincalander.gitsubmodulemanager
          UNITY_VERSION: ${{ inputs.unity_version || '6000.3.22f1' }}
        run: |
          set -euo pipefail

          mapfile -t archives < <(
            find .ci/dist -maxdepth 1 -type f -name '*.tgz' -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one UPM test archive." >&2
            exit 1
          fi

          case "$UNITY_VERSION" in
            6000.3.22f1) test_framework_version=1.6.0 ;;
            6000.5.0f1) test_framework_version=1.7.0 ;;
            *) echo "Unsupported Unity version: $UNITY_VERSION" >&2; exit 1 ;;
          esac

          archive="${archives[0]}"
          archive_name="$(basename "$archive")"
          package_version="$(jq -er '.version' .ci/extracted/package/package.json)"
          expected_archive="$PACKAGE_NAME-$package_version.tgz"
          if [[ "$archive_name" != "$expected_archive" ]]; then
            echo "Unexpected archive name: $archive_name" >&2
            exit 1
          fi

          project=.ci/unity-test-project
          package_reference="file:../../dist/$archive_name"
          mkdir -p \
            "$project/Assets" \
            "$project/Packages" \
            "$project/ProjectSettings"

          jq -n \
            --arg package_name "$PACKAGE_NAME" \
            --arg package_reference "$package_reference" \
            --arg test_framework "$test_framework_version" '
            {
              dependencies: {
                "com.unity.test-framework": $test_framework
              },
              testables: [$package_name],
              enableLockFile: true
            }
            | .dependencies[$package_name] = $package_reference
          ' > "$project/Packages/manifest.json"
          printf 'm_EditorVersion: %s\n' "$UNITY_VERSION" \
            > "$project/ProjectSettings/ProjectVersion.txt"

          resolved_archive="$(
            realpath "$project/Packages/${package_reference#file:}"
          )"
          test "$resolved_archive" = "$(realpath "$archive")"
          echo "package_reference=$package_reference" >> "$GITHUB_OUTPUT"

      - name: Validate Unity license configuration
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "UNITY_EMAIL and UNITY_PASSWORD environment secrets are required." >&2
            exit 1
          fi
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) as an environment secret." >&2
            exit 1
          fi

      - name: Compile exact archive and run EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          packageMode: false
          projectPath: .ci/unity-test-project
          unityVersion: ${{ inputs.unity_version || '6000.3.22f1' }}
          customImage: ${{ steps.unity-image.outputs.image }}
          testMode: EditMode
          artifactsPath: unity-test-results

      - name: Verify exact archive test evidence
        env:
          PACKAGE_NAME: com.martincalander.gitsubmodulemanager
          PACKAGE_REFERENCE: ${{ steps.test-project.outputs.package_reference }}
        run: |
          set -euo pipefail

          lockfile=.ci/unity-test-project/Packages/packages-lock.json
          test -f "$lockfile"
          jq -e \
            --arg package_name "$PACKAGE_NAME" \
            --arg package_reference "$PACKAGE_REFERENCE" '
            .dependencies[$package_name] as $package
            | $package.depth == 0
              and $package.source == "local-tarball"
              and $package.version == $package_reference
              and (.dependencies | has("com.unity.testtools.codecoverage") | not)
          ' "$lockfile" > /dev/null

          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("unity-test-results/editmode-results.xml").getroot()
          total = int(root.attrib.get("total", "0"))
          passed = int(root.attrib.get("passed", "0"))
          skipped_count = int(root.attrib.get("skipped", "0"))
          if (
              root.tag != "test-run"
              or total <= 0
              or int(root.attrib.get("failed", "0")) != 0
              or int(root.attrib.get("inconclusive", "0")) != 0
              or passed + skipped_count != total
              or root.attrib.get("result")
              not in {"Passed", "Skipped", "Skipped:Ignored"}
          ):
              raise SystemExit(f"Invalid NUnit release evidence: {root.attrib}")

          allowed_skips = {
              (
                  "MartinCalander.GitSubmoduleManager.Editor.Tests."
                  "PackageManagerGitHubPackageProjectionTests."
                  "Reconcile_ExcludesAnAlreadyInstalledPackageName"
              ),
              (
                  "MartinCalander.GitSubmoduleManager.Editor.Tests."
                  "PackageManagerGitSubmoduleInstallMenuTests."
                  "InstallForRoot_RepeatedTrackedRootDoesNotDuplicateNativeItem"
              ),
              (
                  "MartinCalander.GitSubmoduleManager.Editor.Tests."
                  "PackageManagerSubmodulePresentationTests."
                  "ActivePageReflectionContract_OpenWindowProvidesDiagnostic"
              ),
          }
          cases = list(root.iter("test-case"))
          skipped = {
              case.attrib.get("fullname", case.attrib.get("name", "<unknown>"))
              for case in cases
              if case.attrib.get("result") == "Skipped"
          }
          unexpected_results = [
              case.attrib
              for case in cases
              if case.attrib.get("result") not in {"Passed", "Skipped"}
          ]
          if (
              len(cases) != total
              or len(skipped) != skipped_count
              or not skipped.issubset(allowed_skips)
              or unexpected_results
          ):
              raise SystemExit(
                  "Unexpected NUnit case results or skips: "
                  f"skipped={sorted(skipped)} results={unexpected_results}"
              )

          assembly_name = (
              "MartinCalander.GitSubmoduleManager.Editor.Tests.dll"
          )
          assemblies = [
              suite for suite in root.iter("test-suite")
              if suite.attrib.get("type") == "Assembly"
              and suite.attrib.get("name") == assembly_name
              and int(suite.attrib.get("total", "0")) > 0
          ]
          if len(assemblies) != 1:
              raise SystemExit(
                  f"Expected one nonempty {assembly_name} suite"
              )
          if skipped:
              print("Allowed environment-dependent skips:", file=sys.stderr)
              for test_name in sorted(skipped):
                  print(f"- {test_name}", file=sys.stderr)
          print(
              "Verified exact archive test evidence: "
              f"total={total}, passed={passed}, skipped={skipped_count}"
          )
          PY

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-editmode-${{ inputs.unity_version || '6000.3.22f1' }}-${{ inputs.ref || github.sha }}
          path: unity-test-results/
          if-no-files-found: warn
          retention-days: 14
