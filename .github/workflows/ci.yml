name: Sanity Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional trusted full commit SHA to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sanity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate UPM package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate repository structure and links
        run: python3 .github/scripts/validate_repository.py

      - name: Lint Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.0
          "**/*.md"
          "#Library"
          "#Temp"

      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Inspect package archive
        run: npm pack --ignore-scripts --dry-run

      - name: Build package archive
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          (cd artifacts && sha256sum -- ./*.tgz > SHA256SUMS)
          (cd artifacts && sha256sum --check SHA256SUMS)

      - name: Upload package preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upm-package-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  portability:
    name: Validate portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Validate repository structure and links
        run: python .github/scripts/validate_repository.py

      - name: Verify package contents on this platform
        run: npm pack --ignore-scripts --dry-run

  unity:
    name: Unity 2021.3 compile and EditMode tests
    # Never expose Unity credentials to pull-request-controlled C#. Enable the
    # push gate with the UNITY_CI_ENABLED repository variable after configuring
    # the protected unity-ci environment, or run it manually for a reviewed ref.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.UNITY_CI_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: unity-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Verify exact Unity test revision
        env:
          REQUESTED_SHA: ${{ inputs.ref || github.sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Unity tests accept only a full 40-character commit SHA." >&2
            exit 1
          fi
          actual_sha="$(git rev-parse --verify HEAD)"
          if [[ "${actual_sha,,}" != "${REQUESTED_SHA,,}" ]]; then
            echo "Checked-out revision does not match the reviewed commit SHA." >&2
            exit 1
          fi

      - name: Stage package below the repository root
        run: |
          mkdir -p .ci/package
          git archive --format=tar HEAD | tar -xf - -C .ci/package

      - name: Validate Unity license configuration
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "UNITY_EMAIL and UNITY_PASSWORD repository secrets are required." >&2
            exit 1
          fi
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) as a repository secret." >&2
            exit 1
          fi

      - name: Compile package and run EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          packageMode: true
          projectPath: .ci/package
          unityVersion: 2021.3.0f1
          testMode: EditMode
          artifactsPath: unity-test-results

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-editmode-${{ github.sha }}
          path: unity-test-results/
          if-no-files-found: warn
          retention-days: 14
