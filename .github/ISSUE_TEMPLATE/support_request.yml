name: Support request
description: Ask for help with installed-package status, sources, or compatibility
title: "[Support]: "
labels: [support, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Check the troubleshooting guide first. Remove credentials and private repository details before submitting.
  - type: input
    id: unity
    attributes:
      label: Unity version
      placeholder: 6000.5.9f1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package branch, version or commit, and Git version
      description: Identify main for status and sources, or legacy for the former manager. Include GitHub CLI only for legacy discovery issues.
      placeholder: main at commit SHA; git 2.50.1
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include complete sanitized errors and relevant troubleshooting steps.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I read the troubleshooting guide.
          required: true
        - label: I removed credentials and sensitive repository information.
          required: true
