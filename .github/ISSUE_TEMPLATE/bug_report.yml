name: Bug report
description: Report a reproducible defect in Git Submodule Manager
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials and private repository details before submitting.
  - type: input
    id: unity
    attributes:
      label: Unity version
      placeholder: 6000.5.9f1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package branch, version, and commit
      description: Identify main for status and sources, or legacy for the former manager. Include the commit SHA or release tag.
      placeholder: main at commit SHA, or legacy release v0.8.1
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: Git version
      description: GitHub CLI is not used on main. Include its version only for a legacy discovery issue.
      placeholder: git 2.50.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest deterministic sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      description: Never include tokens, keys, credentials, or undisclosable private URLs.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed credentials and sensitive repository information.
          required: true
        - label: This is not a security vulnerability.
          required: true
