name: Feature request
description: Propose a focused improvement within the submodule package workflow
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior rather than only implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options: [Windows, macOS, Linux, All platforms]
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This keeps packages as direct Git submodules under Packages/.
          required: true
        - label: This does not require storing credentials or installing system tools from Unity.
          required: true
