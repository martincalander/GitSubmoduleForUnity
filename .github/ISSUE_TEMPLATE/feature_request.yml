name: Feature request
description: Propose a focused improvement to installed-package status, sources, or Editor performance
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear about installed-package status or sources, or what Editor overhead needs attention?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior rather than only implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options: [Windows, macOS, Linux, All platforms]
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This keeps the extension focused on installed-package status and sources, with low Editor overhead.
          required: true
        - label: This leaves installation, updates, conversion, and removal to Unity and Git.
          required: true
        - label: This does not require storing credentials or installing system tools from Unity.
          required: true
